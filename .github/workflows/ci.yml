name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    name: Windows (programme PC + tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build src/CommBluetooth.Windows -c Release
      - run: dotnet build tools/CommBluetooth.TestReceiver -c Release
      - run: dotnet test tests/CommBluetooth.Core.Tests -c Release

  android:
    name: Android (application .apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - run: dotnet workload install maui-android
      - run: dotnet publish src/CommBluetooth.Phone -c Release -f net10.0-android -o publish/android
      - uses: actions/upload-artifact@v4
        with:
          name: CommBluetooth-android
          path: publish/android/*-Signed.apk
          if-no-files-found: error
